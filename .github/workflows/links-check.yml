name: Liens cassés

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  lychee:
    name: Vérification des liens (lychee)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --cache
            --max-cache-age 7d
            --accept '200,206,301,302,403,429'
            --max-concurrency 8
            --timeout 20
            --retry-wait-time 4
            --max-retries 2
            --root-dir "$PWD"
            --exclude-path modulo-export
            './**/*.html'
            './**/*.md'
          fail: true
